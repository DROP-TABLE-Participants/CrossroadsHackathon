name: ERP Generator CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ErpGenerator.slnx
      - run: dotnet build ErpGenerator.slnx --configuration Release --no-restore
      - run: dotnet test ErpGenerator.slnx --configuration Release --no-build
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  connectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/integrations/nango
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/integrations/nango/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
