      "record": {
        "ref": "lot_sugar"
      },
      "field": "quantity",
      "value": 93.16
    },
    {
      "id": "wrapper_conserved",
      "after_step": "finish",
      "type": "record_field_equals",
      "entity": "stock_lot",
