{
  "schema": "erpgenerator.bundle-acceptance-test.v3",
  "test": {
    "key": "order_to_shipment",
    "label": "600 ordered, 200 available, produce 400, release quality, ship 600",
    "contract_hash": "84d5d9ca5cc5257734c06077ffbfd2592b258243a8e5a1ef7105b9f6d11ef339",
    "suite_hash": "8d6fd46a426066c29096464b3b797f699a9fe84b1ccb997464739bfd0ebde663",
    "suite_index": 0
  },
  "setup": {
    "seed": "demo",
    "seed_hash": "1363698f512505fe150fc029ba1778880cb5a278b740973cbea5786b70905f54"
  },
  "actors": [
    {
      "id": "operator",
      "roles": [
        "demo_operator"
      ]
    }
  ],
  "steps": [
    {
      "id": "post_cocoa",
      "type": "run_action",
      "entity": "material_issue",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "issue_cocoa"
      },
      "action": "post_material_issue"
    },
    {
      "id": "post_sugar",
      "type": "run_action",
      "entity": "material_issue",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "issue_sugar"
      },
      "action": "post_material_issue"
    },
    {
      "id": "post_wrapper",
      "type": "run_action",
      "entity": "material_issue",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "issue_wrapper"
      },
      "action": "post_material_issue"
    },
    {
      "id": "produce400",
      "type": "run_action",
      "entity": "production_batch",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "batch_demo"
      },
      "action": "receive_production"
    },
    {
      "id": "shipment400",
      "type": "create_record",
      "entity": "shipment",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "values": {
        "name": "SHIP-400-NEW",
        "order": {
          "ref": "order_demo"
        },
        "product": {
          "ref": "product_belize"
        },
        "lot": {
          "ref": "lot_production"
        },
        "quantity": 400
      }
    },
    {
      "id": "blocked_before_quality",
      "type": "run_action",
      "entity": "shipment",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "shipment400"
      },
      "action": "post_shipment",
      "expected": {
        "outcome": "business_rule_rejected",
        "code": "action.guard",
        "target": "lot_guard"
      }
    },
    {
      "id": "quality",
      "type": "create_record",
      "entity": "quality_check",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "values": {
        "name": "QC-400",
        "lot": {
          "ref": "lot_production"
        },
        "result": "pass",
        "notes": "Simulated tasting and visual pass."
      }
    },
    {
      "id": "release",
      "type": "run_action",
      "entity": "quality_check",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "quality"
      },
      "action": "release_quality"
    },
    {
      "id": "ship200",
      "type": "run_action",
      "entity": "shipment",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "shipment_opening"
      },
      "action": "post_shipment"
    },
    {
      "id": "ship400",
      "type": "run_action",
      "entity": "shipment",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "shipment400"
      },
      "action": "post_shipment"
    },
    {
      "id": "finish",
      "type": "run_action",
      "entity": "sales_order",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "order_demo"
      },
      "action": "close_order"
    }
  ],
