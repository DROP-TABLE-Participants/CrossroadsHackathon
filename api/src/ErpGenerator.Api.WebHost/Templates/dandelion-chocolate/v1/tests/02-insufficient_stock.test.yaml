{
  "schema": "erpgenerator.bundle-acceptance-test.v3",
  "test": {
    "key": "insufficient_stock",
    "label": "Insufficient ingredient stock rolls back posting",
    "contract_hash": "46450b176ca1aca8c782ebb9b082c3093f10213bbc52e5a025544c58999e3183",
    "suite_hash": "8d6fd46a426066c29096464b3b797f699a9fe84b1ccb997464739bfd0ebde663",
    "suite_index": 1
  },
  "setup": {
    "seed": "demo",
    "seed_hash": "1363698f512505fe150fc029ba1778880cb5a278b740973cbea5786b70905f54"
  },
  "actors": [
    {
      "id": "operator",
      "roles": [
        "demo_operator"
      ]
    }
  ],
  "steps": [
    {
      "id": "too_much",
      "type": "create_record",
      "entity": "material_issue",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "values": {
        "name": "Too much cocoa",
        "batch": {
          "ref": "batch_demo"
        },
        "lot": {
          "ref": "lot_belize"
        },
        "kind": "cocoa",
        "quantity": 101
      }
    },
    {
      "id": "reject_stock",
      "type": "run_action",
      "entity": "material_issue",
      "as_role": "demo_operator",
      "as_actor": "operator",
      "record": {
        "ref": "too_much"
      },
      "action": "post_material_issue",
      "expected": {
        "outcome": "business_rule_rejected",
        "code": "action.guard",
        "target": "stock_guard"
      }
    }
  ],
  "assertions": [
    {
      "id": "balance",
      "after_step": "reject_stock",
      "type": "record_field_equals",
      "entity": "stock_lot",
      "record": {
        "ref": "lot_belize"
      },
      "field": "quantity",
      "value": 100
    },
    {
      "id": "not_posted",
      "after_step": "reject_stock",
      "type": "record_field_equals",
      "entity": "material_issue",
      "record": {
        "ref": "too_much"
      },
      "field": "status",
      "value": "draft"
    },
    {
      "id": "no_movement",
      "after_step": "reject_stock",
      "type": "record_count",
      "entity": "stock_movement",
      "count": 6
    }
  ]
}
