module: customers
entity:
  id: customer
  name: customers
  displayName: Customers
  display:
    primary: name
    secondary: email
  fields:
    - id: name
      name: name
      displayName: Name
      type: string
      required: true
    - id: email
      name: email
      displayName: Email
      type: string
      required: false
    - id: phone
      name: phone
      displayName: Phone
      type: string
      required: false
    - id: billing_address
      name: billing_address
      displayName: Billing address
      type: text
      required: false
    - id: shipping_address
      name: shipping_address
      displayName: Shipping address
      type: text
      required: false
    - id: active
      name: active
      displayName: Active
      type: boolean
      required: false
