module: products
entity:
  id: product
  name: products
  displayName: Products
  display:
    primary: sku
    secondary: name
  fields:
    - id: sku
      name: sku
      displayName: SKU
      type: string
      required: true
      unique: true
    - id: name
      name: name
      displayName: Name
      type: string
      required: true
    - id: description
      name: description
      displayName: Description
      type: text
      required: false
    - id: unit_of_measure
      name: unit_of_measure
      displayName: Unit of measure
      type: string
      required: true
    - id: standard_price
      name: standard_price
      displayName: Standard price
      type: money
      required: false
    - id: active
      name: active
      displayName: Active
      type: boolean
      required: false
