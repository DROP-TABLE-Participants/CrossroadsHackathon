module: vendors
entity:
  id: vendor
  name: vendors
  displayName: Vendors
  display:
    primary: name
    secondary: email
  fields:
    - id: name
      name: name
      displayName: Name
      type: string
      required: true
    - id: email
      name: email
      displayName: Email
      type: string
      required: false
    - id: phone
      name: phone
      displayName: Phone
      type: string
      required: false
    - id: address
      name: address
      displayName: Address
      type: text
      required: false
    - id: lead_time_days
      name: lead_time_days
      displayName: Lead time days
      type: integer
      required: false
    - id: active
      name: active
      displayName: Active
      type: boolean
      required: false
