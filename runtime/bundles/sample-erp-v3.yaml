      - action: read
        entity: timesheet
      - action: read_task
        entity: timesheet
      - action: approve_task
        entity: timesheet
      - action: reject_task
        entity: timesheet
      - action: read
        entity: expense
      - action: read_task
        entity: expense
      - action: approve_task
        entity: expense
      - action: reject_task
        entity: expense
  admin:
    displayName: Admin
    grants:
      - action: read
        entity: "*"
      - action: create
        entity: "*"
      - action: update
        entity: "*"
      - action: archive
        entity: "*"
      - action: restore
        entity: "*"
      - action: start_workflow
        entity: "*"
      - action: approve_task
