id: sample_operations_erp
name: Sample Operations ERP
version: 0.1.0
description: A small declarative ERP Bundle used to prove the compiler and runtime foundation.
modules:
  - id: operations
    name: Operations
    entities:
      - id: customer
        name: customers
        displayName: Customers
        display:
          primary: company_name
          secondary: contact_email
        fields:
          - id: company_name
            name: company_name
            displayName: Company name
            type: string
            required: true
            unique: true
          - id: contact_email
            name: contact_email
            displayName: Contact email
            type: string
            required: true
          - id: status
            name: status
            displayName: Status
            type: string
            required: true
      - id: project
        name: projects
        displayName: Projects
        display:
          primary: title
          secondary: customer_id
        fields:
          - id: customer
            name: customer_id
            displayName: Customer
            type: relation
            required: true
            references: customer
          - id: title
            name: title
            displayName: Title
            type: string
            required: true
          - id: budget
            name: budget
            displayName: Budget
            type: money
            required: false
          - id: starts_on
            name: starts_on
            displayName: Starts on
            type: date
            required: false
          - id: project_manager
            name: project_manager_id
            displayName: Project manager
            type: relation
            required: false
            references: employee
          - id: status
            name: status
            displayName: Status
            type: enum
            required: false
            options:
              - planned
              - active
              - paused
              - completed
              - cancelled
      - id: employee
        name: employees
        displayName: Employees
        display:
          primary: full_name
          secondary: email
        fields:
          - id: full_name
            name: full_name
            displayName: Full name
            type: string
            required: true
          - id: email
            name: email
            displayName: Email
            type: string
            required: true
            unique: true
          - id: role
            name: role
            displayName: Role
            type: string
            required: false
          - id: title
            name: title
            displayName: Title
            type: string
            required: false
          - id: hourly_cost
            name: hourly_cost
            displayName: Hourly cost
            type: money
            required: false
          - id: weekly_capacity_hours
            name: weekly_capacity_hours
            displayName: Weekly capacity hours
            type: number
            required: false
      - id: timesheet
        name: timesheets
        displayName: Timesheets
        display:
          primary: logged_on
          secondary: approval_status
        fields:
          - id: employee
            name: employee_id
            displayName: Employee
            type: relation
            required: true
            references: employee
          - id: project
            name: project_id
            displayName: Project
            type: relation
            required: true
            references: project
          - id: logged_on
            name: logged_on
            displayName: Logged on
            type: date
            required: true
          - id: hours
            name: hours
            displayName: Hours
            type: number
            required: true
          - id: billable
            name: billable
            displayName: Billable
            type: boolean
            required: false
          - id: billable_rate
            name: billable_rate
            displayName: Billable rate
            type: money
            required: false
          - id: billable_amount
            name: billable_amount
            displayName: Billable amount
            type: money
            required: false
            computed:
              op: multiply
              left:
                field: hours
              right:
                field: billable_rate
          - id: approval_status
            name: approval_status
            displayName: Approval status
            type: enum
            required: false
            options:
              - draft
              - submitted
              - approved
              - rejected
      - id: invoice
        name: invoices
        displayName: Invoices
        display:
          primary: invoice_number
          secondary: amount
        fields:
          - id: customer
            name: customer_id
            displayName: Customer
            type: relation
            required: true
            references: customer
          - id: project
            name: project_id
            displayName: Project
            type: relation
            required: false
            references: project
          - id: invoice_number
            name: invoice_number
            displayName: Invoice number
            type: string
            required: true
            unique: true
          - id: issued_on
            name: issued_on
            displayName: Issued on
            type: date
            required: true
          - id: amount
            name: amount
            displayName: Amount
            type: money
            required: true
          - id: status
            name: status
            displayName: Status
            type: enum
            required: true
            options:
              - draft
              - sent
              - paid
              - overdue
              - cancelled
          - id: due_date
            name: due_date
            displayName: Due date
            type: date
            required: false
    views:
      - id: active_projects
        name: Active projects
        entity: project
        fields:
          - title
          - customer_id
          - project_manager_id
          - budget
          - starts_on
    workflows:
      - id: timesheet_approval
        name: Timesheet Approval
        entity: timesheet
        trigger:
          action: submit_for_approval
        steps:
          - id: mark_submitted
            type: update_record
            set:
              approval_status: submitted
          - id: audit_submitted
            type: audit_event
            event: timesheet.submitted
            message: Timesheet submitted for approval.
          - id: request_project_manager_approval
            type: approval
            label: Project Manager Approval
            assignedTo:
              type: relation_user
              path: project.project_manager
              requiredRole: member
              fallbackRole: owner
            approveLabel: Approve
            rejectLabel: Reject
          - id: overtime_owner_review
            type: condition
            label: Overtime Owner Review
            condition:
              op: gt
              left:
                field: hours
              right:
                value: 8
            then:
              - id: request_owner_overtime_approval
                type: approval
                label: Owner Overtime Approval
                assignedTo:
                  type: role
                  role: owner
                approveLabel: Approve Overtime
                rejectLabel: Reject Overtime
          - id: mark_approved
            type: update_record
            set:
              approval_status: approved
          - id: audit_approved
            type: audit_event
            event: timesheet.approved
            message: Timesheet approved.
        onRejected:
          - id: mark_rejected
            type: update_record
            set:
              approval_status: rejected
          - id: audit_rejected
            type: audit_event
            event: timesheet.rejected
            message: Timesheet rejected.
reports:
  - key: total_customers
    label: Total customers
    description: Active customer count.
    source: customer
    metrics:
      - key: total_customers
        label: Total customers
        op: count
  - key: total_projects
    label: Total projects
    description: Active project count.
    source: project
    metrics:
      - key: total_projects
        label: Total projects
        op: count
  - key: project_hours
    label: Project hours
    description: Hours and billable hours grouped by project.
    source: timesheet
    group_by:
      - field: project
        label: Project
    metrics:
      - key: total_hours
        label: Total hours
        op: sum
        field: hours
      - key: billable_hours
        label: Billable hours
        op: sum
        field: hours
        filter:
          field: billable
          op: eq
          value: true
      - key: billable_amount
        label: Billable amount
        op: sum
        field: billable_amount
  - key: employee_utilization
    label: Employee utilization
    description: Logged and billable hours grouped by employee.
    source: timesheet
    group_by:
      - field: employee
        label: Employee
    metrics:
      - key: logged_hours
        label: Logged hours
        op: sum
        field: hours
      - key: billable_hours
        label: Billable hours
        op: sum
        field: hours
        filter:
          field: billable
          op: eq
          value: true
  - key: invoices_by_status
    label: Invoices by status
    description: Invoice counts and amount grouped by status.
    source: invoice
    group_by:
      - field: status
        label: Status
    metrics:
      - key: invoice_count
        label: Invoices
        op: count
      - key: invoice_amount
        label: Invoice amount
        op: sum
        field: amount
  - key: unpaid_invoices
    label: Unpaid invoices
    description: Sent and overdue invoice exposure.
    source: invoice
    filters:
      - field: status
        op: in
        values:
          - sent
          - overdue
    metrics:
      - key: unpaid_count
        label: Unpaid invoices
        op: count
      - key: unpaid_amount
        label: Unpaid amount
        op: sum
        field: amount
  - key: project_profitability
    label: Project profitability
    description: First-pass project revenue from invoices. Cost allocation from timesheets is a later report pass.
    source: invoice
    group_by:
      - field: project
        label: Project
    metrics:
      - key: invoice_amount
        label: Invoice amount
        op: sum
        field: amount
dashboard:
  widgets:
    - key: total_customers
      label: Total customers
      type: metric
      report: total_customers
      metric: total_customers
    - key: total_projects
      label: Total projects
      type: metric
      report: total_projects
      metric: total_projects
    - key: billable_hours_this_month
      label: Billable hours this month
      type: metric
      report: project_hours
      metric: billable_hours
    - key: unpaid_invoice_amount
      label: Unpaid invoice amount
      type: metric
      report: unpaid_invoices
      metric: unpaid_amount
roles:
  owner:
    displayName: Owner
    grants:
      - action: "*"
        entity: "*"
      - action: read
        entity: timesheet
      - action: read_task
        entity: timesheet
      - action: approve_task
        entity: timesheet
      - action: reject_task
        entity: timesheet
  admin:
    displayName: Admin
    grants:
      - action: read
        entity: "*"
      - action: create
        entity: "*"
      - action: update
        entity: "*"
      - action: archive
        entity: "*"
      - action: restore
        entity: "*"
      - action: start_workflow
        entity: "*"
      - action: approve_task
        entity: "*"
      - action: reject_task
        entity: "*"
      - action: read_task
        entity: "*"
      - action: admin
        entity: "*"
  member:
    displayName: Member
    grants:
      - action: read
        entity: customer
      - action: read
        entity: project
      - action: read
        entity: timesheet
      - action: create
        entity: timesheet
      - action: update
        entity: timesheet
      - action: start_workflow
        entity: timesheet
      - action: approve_task
        entity: timesheet
      - action: reject_task
        entity: timesheet
      - action: read_task
        entity: timesheet
  readonly:
    displayName: ReadOnly
    grants:
      - action: read
        entity: "*"
