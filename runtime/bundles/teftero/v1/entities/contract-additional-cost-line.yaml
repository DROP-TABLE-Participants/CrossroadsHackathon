module: contracts
entity:
  id: contract_additional_cost_line
  name: contract_additional_cost_lines
  displayName: Contract Additional Cost Lines
  display:
    primary: description
    secondary: cost
  fields:
  - id: contract
    name: contract_id
    displayName: Contract
    type: relation
    required: true
    references: contract
  - id: offer_additional_cost_line
    name: offer_additional_cost_line_id
    displayName: Source offer additional cost
    type: relation
    required: false
    references: offer_additional_cost_line
  - id: description
    name: description
    displayName: Description
    type: string
    required: true
  - id: category
    name: category
    displayName: Category
    type: enum
    required: false
    options:
    - travel
    - software
    - subcontractor
    - other
  - id: cost
    name: cost
    displayName: Cost
    type: money
    required: true

