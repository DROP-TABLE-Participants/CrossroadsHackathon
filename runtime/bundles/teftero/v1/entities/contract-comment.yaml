module: contracts
entity:
  id: contract_comment
  name: contract_comments
  displayName: Contract Comments
  display:
    primary: body
    secondary: commented_at
  fields:
  - id: contract
    name: contract_id
    displayName: Contract
    type: relation
    required: true
    references: contract
  - id: employee
    name: employee_id
    displayName: Employee
    type: relation
    required: false
    references: employee
  - id: body
    name: body
    displayName: Body
    type: text
    required: true
  - id: commented_at
    name: commented_at
    displayName: Commented at
    type: datetime
    required: false
