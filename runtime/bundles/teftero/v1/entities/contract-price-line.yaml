module: contracts
entity:
  id: contract_price_line
  name: contract_price_lines
  displayName: Contract Price Lines
  display:
    primary: description
    secondary: total
  fields:
  - id: contract
    name: contract_id
    displayName: Contract
    type: relation
    required: true
    references: contract
  - id: offer_price_line
    name: offer_price_line_id
    displayName: Source offer price line
    type: relation
    required: false
    references: offer_price_line
  - id: service_catalogue
    name: service_catalogue_id
    displayName: Service
    type: relation
    required: false
    references: service_catalogue
  - id: description
    name: description
    displayName: Description
    type: string
    required: true
  - id: quantity
    name: quantity
    displayName: Quantity
    type: number
    required: true
  - id: unit_price
    name: unit_price
    displayName: Unit price
    type: money
    required: true
  - id: total
    name: total
    displayName: Total
    type: money
    required: false
    computed:
      op: multiply
      left:
        field: quantity
      right:
        field: unit_price

