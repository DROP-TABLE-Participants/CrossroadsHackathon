module: contracts
entity:
  id: contract_team_cost_line
  name: contract_team_cost_lines
  displayName: Contract Team Cost Lines
  display:
    primary: description
    secondary: cost
  fields:
  - id: contract
    name: contract_id
    displayName: Contract
    type: relation
    required: true
    references: contract
  - id: offer_team_cost_line
    name: offer_team_cost_line_id
    displayName: Source offer team cost
    type: relation
    required: false
    references: offer_team_cost_line
  - id: employee
    name: employee_id
    displayName: Employee
    type: relation
    required: false
    references: employee
  - id: description
    name: description
    displayName: Description
    type: string
    required: true
  - id: hours
    name: hours
    displayName: Hours
    type: number
    required: true
  - id: hourly_cost
    name: hourly_cost
    displayName: Hourly cost
    type: money
    required: true
  - id: cost
    name: cost
    displayName: Cost
    type: money
    required: false
    computed:
      op: multiply
      left:
        field: hours
      right:
        field: hourly_cost

