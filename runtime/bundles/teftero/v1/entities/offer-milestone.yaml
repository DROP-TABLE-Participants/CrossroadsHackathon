module: sales
entity:
  id: offer_milestone
  name: offer_milestones
  displayName: Offer Milestones
  display:
    primary: name
    secondary: status
  fields:
  - id: offer
    name: offer_id
    displayName: Offer
    type: relation
    required: true
    references: offer
  - id: name
    name: name
    displayName: Name
    type: string
    required: true
  - id: due_date
    name: due_date
    displayName: Due date
    type: date
    required: false
  - id: amount
    name: amount
    displayName: Amount
    type: money
    required: false
  - id: status
    name: status
    displayName: Status
    type: enum
    required: false
    options:
    - planned
    - completed
    - cancelled

