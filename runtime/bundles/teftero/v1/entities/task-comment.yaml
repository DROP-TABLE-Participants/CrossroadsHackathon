module: delivery
entity:
  id: task_comment
  name: task_comments
  displayName: Task Comments
  display:
    primary: body
    secondary: commented_at
  fields:
  - id: task
    name: task_id
    displayName: Task
    type: relation
    required: true
    references: task
  - id: employee
    name: employee_id
    displayName: Employee
    type: relation
    required: false
    references: employee
  - id: body
    name: body
    displayName: Body
    type: text
    required: true
  - id: commented_at
    name: commented_at
    displayName: Commented at
    type: datetime
    required: false

