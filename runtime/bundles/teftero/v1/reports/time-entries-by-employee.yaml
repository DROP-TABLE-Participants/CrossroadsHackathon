report:
  key: time_entries_by_employee
  label: Time entries by employee
  description: Logged hours grouped by employee.
  source: time_entry
  group_by:
  - field: employee
    label: Employee
  metrics:
  - key: entry_count
    label: Entries
    op: count
  - key: total_hours
    label: Total hours
    op: sum
    field: hours

